[pytest]
# The Data model in main.py is provided as "DO NOT MODIFY" and uses Pydantic v1-style
# Field(example=...) / .dict(); hide those deprecation warnings from the test report.
filterwarnings =
    ignore::DeprecationWarning
    ignore:.*PydanticDeprecatedSince20.*
    ignore::pydantic.warnings.PydanticDeprecatedSince20
